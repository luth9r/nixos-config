# Hyprlock Configuration
# Modular standalone configuration for Hyprlock (Generated from vars.nix)

$font = @font@

# Background with live screenshot blur
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Clock (Hours : Minutes)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(@colorFgRgb@, 0.95)
    font_size = 84
    font_family = $font Bold
    position = 0, 140
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.4)
}

# Date in Numbers (DD.MM.YYYY)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%d.%m.%Y")"
    color = rgba(@colorFgRgb@, 0.85)
    font_size = 18
    font_family = $font
    position = 0, 70
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
}

# User Status / Badge with clean lock glyph
label {
    monitor =
    text =   $USER
    color = rgba(@colorFgMutedRgb@, 0.75)
    font_size = 14
    font_family = $font
    position = 0, 15
    halign = center
    valign = center
}

# Modern Pill Input Field
input-field {
    monitor =
    size = 280, 46
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.28
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(@colorBorderActive1Rgb@, 0.18)
    inner_color = rgba(@colorSurfaceRgb@, 0.75)
    font_color = rgb(@colorFgRgb@)
    fade_on_empty = false
    placeholder_text = <span foreground="##@colorFgMutedHex@"><i>Password...</i></span>
    hide_input = false
    rounding = 23
    check_color = rgba(@colorFgMutedRgb@, 0.8)
    fail_color = rgb(@colorWarningRgb@)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    capslock_color = rgb(@colorBorderActive2Rgb@)
    position = 0, -60
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.5)
}
