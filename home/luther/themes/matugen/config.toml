[config]
# Global Matugen configuration

[templates.hyprland]
input_path = "~/.config/matugen/templates/colors.lua"
output_path = "~/.config/hypr/colors.lua"
post_hook = "hyprctl reload 2>/dev/null || true"

[templates.wayle]
input_path = "~/.config/matugen/templates/wayle.toml"
output_path = "~/.config/wayle/themes/matugen.toml"

[templates.kitty]
input_path = "~/.config/matugen/templates/colors.conf"
output_path = "~/.config/kitty/colors.conf"
post_hook = "kitty @ set-colors --all --configured ~/.config/kitty/colors.conf 2>/dev/null || true"

[templates.rofi]
input_path = "~/.config/matugen/templates/colors.rasi"
output_path = "~/.config/rofi/colors.rasi"


