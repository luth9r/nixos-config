# Centralized Minimalist Kitty Colors
# Generated dynamically from vars.nix
foreground            @colorFg@
background            @colorBg@
selection_foreground  @colorAccentFg@
selection_background  @colorAccent@

cursor                @colorAccent@
cursor_text_color     @colorAccentFg@

# Black (Surface / Inactive border)
color0                @colorSurface@
color8                @colorBorder@

# Red (Errors, Git Deletions)
color1                @colorRed@
color9                @colorRed@

# Green (Success, Git Additions)
color2                @colorGreen@
color10               @colorGreen@

# Yellow (Warnings, Highlights)
color3                @colorYellow@
color11               @colorYellow@

# Blue (Directories, Information)
color4                @colorBlue@
color12               @colorBlue@

# Magenta (Keywords, Special)
color5                @colorMagenta@
color13               @colorMagenta@

# Cyan (Strings, Paths)
color6                @colorCyan@
color14               @colorCyan@

# White (Foreground / Highlights)
color7                @colorFg@
color15               @colorAccent@
